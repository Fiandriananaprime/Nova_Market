  # ============================================================
  /checkout:
    post:
      tags: [Buyer - Checkout & Orders]
      summary: Place order (Checkout.tsx — delivery/method/payment/review steps)
      description: >
        Converts current cart into one or more orders (one per seller if
        the cart contains products from multiple stores) and triggers payment
        (MVola, Orange Money, Card, or COD).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order(s) created
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '400':
          description: Empty cart or missing delivery info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Payment failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Insufficient stock on one or more items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }


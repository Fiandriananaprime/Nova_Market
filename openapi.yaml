      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  /categories/{id}:
    get:
      tags: [Catalog]
      summary: Category details
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products:
    get:
      tags: [Catalog]
      summary: Search / filter products (Buyer catalog)
      description: Powers Shop.tsx and Products.tsx (search, filters, sorting, pagination).
      security: []
      parameters:
        - { $ref: '#/components/parameters/SearchParam' }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/LimitParam' }
        - name: category
          in: query
          schema: { type: string }
          description: Category ID
        - name: sellerId
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: minRating
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: onSale
          in: query
          schema: { type: boolean }
          description: Filter products on sale (discount > 0)
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, rating, newest]
            default: relevance
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /products/featured:
    get:
      tags: [Catalog]
      summary: List featured products
      description: >
        Returns up to 8 active products with a rating strictly greater than 4.5
        and a discount strictly greater than 5 percent, sorted by rating in
        descending order. This endpoint is public and does not accept filters
        that could change the featured selection.
      security: []
      responses:
        '200':
          description: Featured products, limited to 8 items
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 8
                    items: { $ref: '#/components/schemas/Product' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PaginationMeta'
                      - type: object
                        properties:
                          page: { type: integer, example: 1 }
                          limit: { type: integer, example: 8, maximum: 8 }
                          total: { type: integer, example: 8 }
                          totalPages: { type: integer, example: 1 }

  /products/{id}:
    get:
      tags: [Catalog]
      summary: Product details
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products/{id}/related:

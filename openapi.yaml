openapi: 3.0.3
info:
  title: Nova Market API
  description: >
    OpenAPI specification for the Nova Market backend API, the Malagasy e-commerce
    multi-vendor marketplace. This specification covers all endpoints needed
    to replace mock data (src/data/mock.ts) in the React frontend
    (repo Fiandriananaprime/Nova_Market) and power the three application portals:
    Buyer, Seller, and Admin, as well as public pages (landing, catalog, login/register).
  version: 1.0.0
  contact:
    name: Nova Market Engineering
    email: dev@novamarket.mg
  license:
    name: Proprietary

servers:
  - url: https://api.novamarket.mg/v1
    description: Production
  - url: https://staging-api.novamarket.mg/v1
    description: Staging
  - url: http://localhost:4000/v1
    description: Local development

tags:
  - name: Auth
    description: Registration, login, session management (buyer, seller, admin)
  - name: Catalog
    description: Categories, products, stores (public + buyer access)
  - name: Buyer - Cart
    description: Authenticated buyer's shopping cart
  - name: Buyer - Checkout & Orders
    description: Buyer checkout funnel and order tracking
  - name: Buyer - Favorites
    description: Favorites list (products, followed stores)
  - name: Buyer - Profile & Settings
    description: Buyer profile, preferences, and notifications
  - name: Buyer - Reviews
    description: Product reviews left by the buyer
  - name: Seller - Dashboard
    description: Seller KPIs and dashboard overview
  - name: Seller - Products
    description: Seller product catalog management
  - name: Seller - Inventory
    description: Inventory management and out-of-stock alerts
  - name: Seller - Orders
    description: Orders received by the seller
  - name: Seller - Analytics
    description: Seller sales statistics and analytics
  - name: Seller - Reviews
    description: Reviews received and seller responses
  - name: Seller - Promotions
    description: Seller promo codes and discounts
  - name: Seller - Store
    description: Seller store settings
  - name: Seller - Customers
    description: Seller customer base
  - name: Admin - Dashboard
    description: Global platform KPIs
  - name: Admin - Users
    description: User management (buyers, sellers, admins)
  - name: Admin - Seller Applications
    description: Seller applications to validate
  - name: Admin - Products
    description: Product moderation
  - name: Admin - Categories
    description: Category tree management
  - name: Admin - Orders
    description: Global view of all platform orders
  - name: Admin - Payments
    description: Transactions and platform commissions
  - name: Admin - Promotions
    description: Global promotions view (all stores)
  - name: Admin - Reviews
    description: Review moderation
  - name: Admin - Settings
    description: Platform settings (commission rate, etc.)
  - name: Admin - Reports
    description: Platform reports and analytics

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT token returned by /auth/login or /auth/register. The role
        (buyer/seller/admin) is encoded in the token and verified server-side
        for each restricted endpoint.

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: Page number (pagination)
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Number of items per page
    SearchParam:
      name: search
      in: query
      schema: { type: string }
      description: Full-text search
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: "VALIDATION_ERROR" }
            message: { type: string, example: "The email field is invalid." }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
      required: [error]

    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 96 }
        totalPages: { type: integer, example: 5 }

    Lang:
      type: string
      enum: [en, fr]

    UserRole:
      type: string
      enum: [buyer, seller, admin]

    # ---------- AUTH ----------
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 3600 }

    User:
      type: object
      properties:
        id: { type: string, example: "1" }
        firstName: { type: string, example: "Rakoto" }
        lastName: { type: string, example: "Andry" }
        name: { type: string, example: "Rakoto Andry" }
        email: { type: string, format: email }
        phone: { type: string, example: "+261 34 123 4567" }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { type: string, enum: [active, suspended], example: active }
        avatarUrl: { type: string, nullable: true }
        joinedAt: { type: string, format: date }
        ordersCount: { type: integer, example: 12 }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/Address' }

    RegisterBuyerRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName: { type: string, example: "Andry" }
        lastName: { type: string, example: "Rakoto" }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    RegisterSellerRequest:
      type: object
      required: [firstName, lastName, email, password, businessName, phone, location]
      properties:
        firstName: { type: string, example: "Jean" }
        lastName: { type: string, example: "Rakoto" }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        businessName: { type: string, example: "My Store MG" }
        phone: { type: string, example: "+261 34 000 0000" }
        location: { type: string, example: "Antananarivo" }
        category: { type: string, example: "Electronics" }
        description: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        remember: { type: boolean, default: false }

    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/AuthTokens' }

    # ---------- CATALOG ----------
    Category:
      type: object
      properties:
        id: { type: string, example: "1" }
        name: { type: string, example: "Electronics" }
        nameF: { type: string, example: "Électronique" }
        icon: { type: string, example: "Cpu" }
        image: { type: string, example: "photo-1498049794561-7780e7231661" }
        count: { type: integer, example: 2450 }
        parentId: { type: string, nullable: true, example: null }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        nameF: { type: string }
        icon: { type: string }
        image: { type: string }
        parentId: { type: string, nullable: true }

    ProductSpecs:
      type: object
      additionalProperties: { type: string }
      example: { Display: "6.7\" AMOLED", RAM: "8GB", Storage: "256GB" }

    ProductVariant:
      type: object
      properties:
        name: { type: string, example: "Color" }
        values:
          type: array
          items: { type: string }
          example: ["Black", "White"]

    Product:
      type: object
      properties:
        id: { type: string, example: "1" }
        name: { type: string, example: "Samsung Galaxy A56" }
        nameF: { type: string, example: "Samsung Galaxy A56" }
        brand: { type: string, example: "Samsung" }
        description: { type: string }
        price: { type: number, example: 1299000 }
        originalPrice: { type: number, nullable: true, example: 1450000 }
        discount: { type: number, example: 10 }
        rating: { type: number, example: 4.8 }
        reviewsCount: { type: integer, example: 342 }
        sellerId: { type: string, example: "1" }
        sellerName: { type: string, example: "TechStore MG" }
        categoryId: { type: string, example: "7" }
        image: { type: string }
        images:
          type: array
          items: { type: string }
        stock: { type: integer, example: 45 }
        sku: { type: string, example: "SKU-001" }
        tags:
          type: array
          items: { type: string }
          example: ["smartphone", "5G"]
        specs: { $ref: '#/components/schemas/ProductSpecs' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        weightGrams: { type: number, example: 200 }
        dimensions: { type: string, example: "15x10x5" }
        status:
          type: string
          enum: [draft, active, inactive, pending, approved, rejected]
          example: approved
        createdAt: { type: string, format: date-time }

    ProductInput:
      type: object
      required: [name, price, categoryId, stock]
      properties:
        name: { type: string }
        description: { type: string }
        brand: { type: string }
        categoryId: { type: string }
        tags:
          type: array
          items: { type: string }
        images:
          type: array
          items: { type: string, format: binary }
        price: { type: number }
        promotionalPrice: { type: number, nullable: true }
        sku: { type: string }
        stock: { type: integer }
        lowStockThreshold: { type: integer, default: 10 }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        weightGrams: { type: number }
        dimensions: { type: string }
        status:
          type: string
          enum: [active, draft, inactive]
          default: draft

    Seller:
      type: object
      properties:
        id: { type: string, example: "1" }
        name: { type: string, example: "TechStore MG" }
        logo: { type: string }
        cover: { type: string }
        verified: { type: boolean }
        rating: { type: number, example: 4.9 }
        productsCount: { type: integer, example: 1240 }
        location: { type: string, example: "Antananarivo" }
        joinedYear: { type: string, example: "2023" }
        followersCount: { type: integer, example: 8420 }
        description: { type: string }
        isFollowedByCurrentUser: { type: boolean }

    Review:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        productName: { type: string }
        customerId: { type: string }
        customerName: { type: string, example: "Rakoto A." }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        date: { type: string, format: date }
        replied: { type: boolean, default: false }
        reply: { type: string, nullable: true }

    ReviewInput:
      type: object
      required: [rating, comment]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }

    ReviewReplyInput:
      type: object
      required: [reply]
      properties:
        reply: { type: string }

    # ---------- CART / ORDERS ----------
    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string, example: "Home" }
        fullAddress: { type: string, example: "12 Rue Rainitovo, Antananarivo 101" }
        city: { type: string, example: "Antananarivo" }
        phone: { type: string }
        isDefault: { type: boolean }

    CartItem:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        image: { type: string }
        price: { type: number }
        qty: { type: integer }
        sellerId: { type: string }
        sellerName: { type: string }
        stock: { type: integer }

    CartItemInput:
      type: object
      required: [productId, qty]
      properties:
        productId: { type: string }
        qty: { type: integer, minimum: 1, default: 1 }

    CartItemUpdate:
      type: object
      required: [qty]
      properties:
        qty: { type: integer, minimum: 0 }

    Cart:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal: { type: number }
        itemsCount: { type: integer }

    OrderItem:
      type: object
      properties:
        productId: { type: string }
        productName: { type: string }
        image: { type: string }
        price: { type: number }
        qty: { type: integer }
        sellerId: { type: string }
        sellerName: { type: string }

    OrderStatus:
      type: string
      enum: [pending, confirmed, processing, preparing, shipped, delivered, cancelled]

    Order:
      type: object
      properties:
        id: { type: string, example: "ORD-2026-001" }
        buyerId: { type: string }
        buyerName: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        sellerNames:
          type: array
          items: { type: string }
        subtotal: { type: number }
        shippingFee: { type: number }
        total: { type: number }
        status: { $ref: '#/components/schemas/OrderStatus' }
        deliveryMethod: { type: string, enum: [standard, express, pickup] }
        paymentMethod: { type: string, enum: [mvola, orange_money, card, cod] }
        paymentStatus: { type: string, enum: [pending, paid, failed, refunded] }
        address: { $ref: '#/components/schemas/Address' }
        tracking: { type: string, nullable: true, example: "TRK892345MG" }
        estimatedDelivery: { type: string, format: date, nullable: true }
        date: { type: string, format: date-time }

    CheckoutRequest:
      type: object
      required: [addressId, deliveryMethod, paymentMethod]
      properties:
        addressId: { type: string }
        newAddress: { $ref: '#/components/schemas/Address' }
        deliveryMethod: { type: string, enum: [standard, express, pickup] }
        paymentMethod: { type: string, enum: [mvola, orange_money, card, cod] }
        paymentPhoneNumber: { type: string, nullable: true, example: "+261 34 000 0000" }
        note: { type: string, nullable: true }

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        tracking: { type: string, nullable: true }

    # ---------- FAVORITES ----------
    FavoriteToggleResponse:
      type: object
      properties:
        productId: { type: string }
        isFavorite: { type: boolean }

    # ---------- BUYER SETTINGS ----------
    NotificationPrefs:
      type: object
      properties:
        orders: { type: boolean, default: true }
        promotions: { type: boolean, default: true }
        sellers: { type: boolean, default: false }
        recommendations: { type: boolean, default: true }
        email: { type: boolean, default: false }

    UserSettings:
      type: object
      properties:
        theme: { type: string, enum: [light, dark, system] }
        lang: { $ref: '#/components/schemas/Lang' }
        notifications: { $ref: '#/components/schemas/NotificationPrefs' }

    ProfileUpdateRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        avatarUrl: { type: string }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/Address' }

    # ---------- SELLER ----------
    SellerMetrics:
      type: object
      properties:
        revenue: { type: number, example: 12580000 }
        orders: { type: integer, example: 183 }
        products: { type: integer, example: 426 }
        lowStock: { type: integer, example: 8 }
        revenueChangePct: { type: number, example: 12.4 }
        ordersChangePct: { type: number, example: 8.1 }
        productsChangePct: { type: number, example: 5.2 }
        lowStockChangePct: { type: number, example: -2 }

    RevenuePoint:
      type: object
      properties:
        month: { type: string, example: "Aug" }
        revenue: { type: number }
        orders: { type: integer }

    SellerDashboard:
      type: object
      properties:
        metrics: { $ref: '#/components/schemas/SellerMetrics' }
        revenueSeries:
          type: array
          items: { $ref: '#/components/schemas/RevenuePoint' }
        recentOrders:
          type: array
          items: { $ref: '#/components/schemas/Order' }

    InventoryItem:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        sku: { type: string }
        stock: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        threshold: { type: integer }
        status: { type: string, enum: [in_stock, low_stock, out_of_stock] }

    InventoryUpdate:
      type: object
      properties:
        stock: { type: integer }
        threshold: { type: integer }

    SellerAnalytics:
      type: object
      properties:
        period: { type: string, enum: [today, 7d, 30d, 3m, custom] }
        totalRevenue: { type: number }
        totalOrders: { type: integer }
        conversionRate: { type: number }
        storeViews: { type: integer }
        revenueSeries:
          type: array
          items: { $ref: '#/components/schemas/RevenuePoint' }
        topProducts:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              unitsSold: { type: integer }
        salesByCategory:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              percentage: { type: number }

    Promotion:
      type: object
      properties:
        id: { type: string }
        sellerId: { type: string }
        sellerName: { type: string }
        name: { type: string, example: "Back to School Sale" }
        type: { type: string, enum: [percentage, fixed] }
        discount: { type: number, example: 15 }
        productIds:
          type: array
          items: { type: string }
        productsCount: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [active, scheduled, inactive, expired] }

    PromotionInput:
      type: object
      required: [name, type, discount, startDate, endDate]
      properties:
        name: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        discount: { type: number }
        productIds:
          type: array
          items: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    Customer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        avatarInitial: { type: string, example: "R" }
        ordersCount: { type: integer }
        totalSpent: { type: number }
        lastOrderDate: { type: string, format: date }
        status: { type: string, enum: [active, inactive] }

    StoreSettings:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        logoUrl: { type: string }
        coverUrl: { type: string }
        location: { type: string }
        phone: { type: string }
        email: { type: string }
        isOpen: { type: boolean }
        businessHours: { type: string }
        socialLinks:
          type: object
          properties:
            facebook: { type: string }
            instagram: { type: string }
            website: { type: string }

    StoreSettingsUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        logoUrl: { type: string }
        coverUrl: { type: string }
        location: { type: string }
        phone: { type: string }
        email: { type: string }
        isOpen: { type: boolean }
        businessHours: { type: string }
        socialLinks:
          type: object
          properties:
            facebook: { type: string }
            instagram: { type: string }
            website: { type: string }

    # ---------- ADMIN ----------
    AdminMetrics:
      type: object
      properties:
        totalRevenue: { type: number, example: 284500000 }
        totalOrders: { type: integer, example: 8432 }
        totalBuyers: { type: integer, example: 24800 }
        totalSellers: { type: integer, example: 342 }
        totalProducts: { type: integer, example: 18650 }
        pendingApplications: { type: integer, example: 14 }
        pendingProducts: { type: integer, example: 38 }

    AdminRevenuePoint:
      type: object
      properties:
        month: { type: string }
        revenue: { type: number }
        sellers: { type: integer }
        buyers: { type: integer }

    AdminDashboard:
      type: object
      properties:
        metrics: { $ref: '#/components/schemas/AdminMetrics' }
        revenueSeries:
          type: array
          items: { $ref: '#/components/schemas/AdminRevenuePoint' }

    AdminTopSeller:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        location: { type: string, nullable: true }
        category: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended] }
        revenue: { type: number }
        ordersCount: { type: integer }
        rating: { type: number, format: float, minimum: 4.5, exclusiveMinimum: true, maximum: 5 }

    UserStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, suspended] }

    SellerApplication:
      type: object
      properties:
        id: { type: string, example: "APP-001" }
        businessName: { type: string }
        owner: { type: string }
        email: { type: string }
        phone: { type: string }
        location: { type: string }
        category: { type: string }
        date: { type: string, format: date }
        status: { type: string, enum: [pending, approved, rejected] }

    SellerApplicationReview:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, reject] }
        reason: { type: string, nullable: true }

    ProductModerationUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected, inactive] }
        reason: { type: string, nullable: true }

    Transaction:
      type: object
      properties:
        id: { type: string, example: "PAY-001" }
        orderId: { type: string }
        buyerName: { type: string }
        sellerName: { type: string }
        amount: { type: number }
        method: { type: string, enum: [MVola, Orange Money, Card, COD] }
        commission: { type: number }
        status: { type: string, enum: [completed, pending, failed, refunded] }
        date: { type: string, format: date }

    PaymentsSummary:
      type: object
      properties:
        totalVolume: { type: number }
        totalCommission: { type: number }
        seriesByMonth:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              mvola: { type: number }
              orangeMoney: { type: number }
              card: { type: number }
              cod: { type: number }

    PlatformSettings:
      type: object
      properties:
        commissionRatePct: { type: number, example: 10 }
        supportedPaymentMethods:
          type: array
          items: { type: string }
          example: ["MVola", "Orange Money", "Card", "COD"]
        standardShippingFee: { type: number, example: 3500 }
        expressShippingFee: { type: number, example: 12000 }
        maintenanceMode: { type: boolean, default: false }

    PlatformSettingsUpdate:
      type: object
      properties:
        commissionRatePct: { type: number }
        supportedPaymentMethods:
          type: array
          items: { type: string }
        standardShippingFee: { type: number }
        expressShippingFee: { type: number }
        maintenanceMode: { type: boolean }

paths:
  # ============================================================
  # AUTH
  # ============================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register buyer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterBuyerRequest' }
      responses:
        '201':
          description: Account created and session established
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/register/seller:
    post:
      tags: [Auth]
      summary: Submit seller application
      description: >
        Creates a pending user and seller application
        (SellerApplication, status=pending) to be validated by an admin
        via /admin/sellers/applications/{id}.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterSellerRequest' }
      responses:
        '201':
          description: Application submitted, pending admin validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerApplication' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (buyer, seller, or admin)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Account suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          description: Refresh token invalid or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidates refresh token)

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Refresh token to invalidate

      responses:
        '204':
          description: Logged out
        '401':
          description: Invalid or expired refresh token

